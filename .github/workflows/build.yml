name: Build APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Настраиваем Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Настраиваем Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Создаем каркас приложения
        run: flutter create my_app

      - name: Вставляем наш код
        run: cp lib/main.dart my_app/lib/main.dart

      - name: Добавляем системные разрешения в AndroidManifest
        run: |
          sed -i 's/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">/<manifest xmlns:android="http:\/\/schemas.android.com\/apk\/res\/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"\/>\n    <uses-permission android:name="android.permission.VIBRATE"\/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"\/>/g' my_app/android/app/src/main/AndroidManifest.xml

      - name: Добавляем библиотеки
        run: |
          cd my_app
          flutter pub add shared_preferences
          flutter pub add awesome_notifications
          flutter pub get

      - name: Собираем APK
        run: |
          cd my_app
          flutter build apk --release

      - name: Выгружаем готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: quit-smoking-app-apk
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
